spring.application.name=delta

spring.datasource.url=${DATASOURCE_URL:jdbc:postgresql://localhost:5432/delta}
spring.datasource.username=${DATASOURCE_USERNAME:postgres}
spring.datasource.password=${DATASOURCE_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

firebase.service-account=firebase/service-account.json

jwt.secret=${JWT_SECRET:change-this-to-a-very-long-random-secret-key-at-least-32-bytes}
jwt.access-token-expiration=900000
jwt.refresh-token-expiration=2592000000
jwt.refresh-token.cleanup-interval=86400000
jwt.refresh-token.revoked-retention=604800000
