spring.application.name=delta

spring.datasource.url=${DATASOURCE_URL:jdbc:postgresql://localhost:5432/delta}
spring.datasource.username=${DATASOURCE_USERNAME:postgres}
spring.datasource.password=${DATASOURCE_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:false}

firebase.service-account=${FIREBASE_SERVICE_ACCOUNT_PATH:firebase/service-account.json}

jwt.secret=${JWT_SECRET:change-this-to-a-very-long-random-secret-key-at-least-32-bytes}
jwt.access-token-expiration=900000
jwt.refresh-token-expiration=2592000000
jwt.refresh-token.cleanup-interval=86400000
jwt.refresh-token.revoked-retention=604800000

management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db,firebase
management.prometheus.metrics.export.enabled=true
management.info.env.enabled=true

info.app.name=${spring.application.name}
info.app.api-version=v1

server.forward-headers-strategy=framework
logging.pattern.level=%5p [requestId=%X{requestId:-} userId=%X{userId:-}]
