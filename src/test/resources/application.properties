spring.datasource.url=jdbc:h2:mem:delta;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

firebase.service-account=unused

jwt.secret=1234567890123456789012345678901234567890123456789012345678901234
jwt.access-token-expiration=900000
jwt.refresh-token-expiration=2592000000
jwt.refresh-token.cleanup-interval=86400000
jwt.refresh-token.revoked-retention=604800000

spring.main.allow-bean-definition-overriding=true
